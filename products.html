<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="main">
    <div class="content">

      <!-- Page head -->
      <div class="page-head">
        <div>
          <h2>Products</h2>
          <p>Manage your menu — add, edit, or deactivate items.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="addProductBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Product
          </button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="productFilter" placeholder="Search products by name or category…" />
        </div>
        <div class="date-tabs" id="productStatusTabs">
          <button class="date-tab active" data-status="all">All</button>
          <button class="date-tab" data-status="active">Active</button>
          <button class="date-tab" data-status="inactive">Inactive</button>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th class="num">Price</th>
                <th class="num">Tax %</th>
                <th>Unit</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsBody">
              <tr>
                <td><span class="ph">[Product Name]</span></td>
                <td><span class="ph">[Category]</span></td>
                <td class="num"><span class="ph">[Price]</span></td>
                <td class="num"><span class="ph">[Tax]</span></td>
                <td><span class="ph">[Unit]</span></td>
                <td><span class="pill active">Active</span></td>
                <td>
                  <div class="row-actions">
                    <button class="btn btn-icon" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
                    <button class="btn btn-icon" title="Deactivate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Modal (add/edit product) -->
      <div class="modal-overlay" id="productModal" hidden>
        <div class="modal">
          <div class="modal-head">
            <h3 id="productModalTitle">Add Product</h3>
            <button class="btn btn-icon" id="productModalClose" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="modal-body">
            <form id="productForm" class="form-grid" autocomplete="off">
              <input type="hidden" id="productId" />
              <div class="field span-2">
                <label>Product Name</label>
                <input class="input" type="text" id="productName" required maxlength="80" />
              </div>
              <div class="field">
                <label>Category</label>
                <input class="input" type="text" id="productCategory" maxlength="40" placeholder="e.g. Starters" />
              </div>
              <div class="field">
                <label>Unit</label>
                <select class="select" id="productUnit">
                  <option value="plate">Plate</option>
                  <option value="piece">Piece</option>
                  <option value="glass">Glass</option>
                  <option value="bowl">Bowl</option>
                  <option value="kg">Kg</option>
                  <option value="liter">Liter</option>
                </select>
              </div>
              <div class="field">
                <label>Price (₹)</label>
                <input class="input" type="number" id="productPrice" min="0" step="0.01" required />
              </div>
              <div class="field">
                <label>Tax Rate (%)</label>
                <input class="input" type="number" id="productTax" min="0" max="100" step="0.01" value="5" />
              </div>
              <div class="field span-2">
                <label>Description <span class="hint">optional</span></label>
                <textarea class="textarea" id="productDescription" maxlength="200"></textarea>
              </div>
              <div class="field span-2">
                <div class="toggle-row">
                  <div>
                    <div class="label">Active</div>
                    <div class="sub">Inactive products won't appear in billing</div>
                  </div>
                  <div class="switch on" id="productActiveSwitch"></div>
                </div>
              </div>
            </form>
          </div>

          <div class="modal-foot">
            <button class="btn btn-ghost" id="productModalCancel">Cancel</button>
            <button class="btn btn-primary" id="productModalSave">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              Save Product
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
