    </filter>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
      }
      .muted { fill: #707070; }
      .black { fill: #111111; }
      .line { stroke: #dedede; }
      .small { font-size: 16px; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    </style>
  </defs>

  <!-- Background -->
