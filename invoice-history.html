<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202124">
  <meta name="description" content="Find and review restaurant invoices.">

  <title>Previous Bills | [Restaurant Name]</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/buttons.css">

  <script src="js/invoice-history.js" defer></script>
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="dashboard.html">[Restaurant Name]</a>

      <nav class="app-nav" aria-label="Main navigation">
        <a href="billing.html">New Bill</a>
        <a href="invoice-history.html" aria-current="page">Bills</a>
        <a href="products.html">Menu Items</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main class="app-container">
    <section class="page-header">
      <h1>Previous Bills</h1>
      <p>Search for an invoice by bill number or customer name.</p>
    </section>

    <section class="content-card section-spacing">
      <div class="bill-field">
        <label for="invoiceSearch">Search bills</label>
        <input
          id="invoiceSearch"
          type="search"
          placeholder="Enter bill number or customer name"
          autocomplete="off"
        >
      </div>

      <div class="filters">
        <div class="bill-field">
          <label for="invoiceDate">Invoice date</label>
          <input id="invoiceDate" type="date">
        </div>

        <button class="btn btn-secondary" id="clearFiltersButton" type="button">
          Clear Filters
        </button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th scope="col">Bill No.</th>
              <th scope="col">Date</th>
              <th scope="col">Customer</th>
              <th scope="col">Total</th>
              <th scope="col">Action</th>
            </tr>
          </thead>

          <tbody id="invoiceList">
            <tr>
              <td colspan="5">Loading bills...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p id="invoiceMessage" class="form-help" role="status">
        Demo mode: saved invoice history is not connected yet.
      </p>
    </section>

    <section class="section-spacing">
      <a class="btn btn-primary btn-block" href="billing.html">
        + Create New Bill
      </a>
    </section>

    <footer class="home-footer">
      <p>[Restaurant Name] · Billing System</p>
    </footer>
  </main>
</body>
</html>
