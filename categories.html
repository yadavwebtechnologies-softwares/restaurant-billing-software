<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="main">
    <div class="content">

      <!-- Page head -->
      <div class="page-head">
        <div>
          <h2>Categories</h2>
          <p>Organize your menu into sections.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="addCategoryBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Category
          </button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="categoryFilter" placeholder="Search categories…" />
        </div>
        <div class="date-tabs" id="categoryStatusTabs">
          <button class="date-tab active" data-status="all">All</button>
          <button class="date-tab" data-status="active">Active</button>
          <button class="date-tab" data-status="inactive">Inactive</button>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:70px;">Order</th>
                <th>Name</th>
                <th>Description</th>
                <th class="num">Products</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categoriesBody">
              <tr>
                <td><span class="ph">[Order]</span></td>
                <td><span class="ph">[Category Name]</span></td>
                <td><span class="ph">[Description]</span></td>
                <td class="num"><span class="ph">[Count]</span></td>
                <td><span class="pill active">Active</span></td>
                <td>
                  <div class="row-actions">
                    <button class="btn btn-icon" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
                    <button class="btn btn-icon" title="Deactivate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal-overlay" id="categoryModal" hidden>
        <div class="modal" style="max-width: 460px;">
          <div class="modal-head">
            <h3 id="categoryModalTitle">Add Category</h3>
            <button class="btn btn-icon" id="categoryModalClose" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="modal-body">
            <form id="categoryForm" class="form-grid" autocomplete="off">
              <input type="hidden" id="categoryId" />
              <div class="field span-2">
                <label>Category Name</label>
                <input class="input" type="text" id="categoryName" required maxlength="60" />
              </div>
              <div class="field span-2">
                <label>Description <span class="hint">optional</span></label>
                <textarea class="textarea" id="categoryDescription" maxlength="200"></textarea>
              </div>
              <div class="field">
                <label>Display Order</label>
                <input class="input" type="number" id="categoryOrder" min="0" step="1" value="0" />
              </div>
              <div class="field">
                <label>Active</label>
                <div class="switch-wrap">
                  <div class="switch on" id="categoryActiveSwitch"></div>
                </div>
              </div>
            </form>
          </div>

          <div class="modal-foot">
            <button class="btn btn-ghost" id="categoryModalCancel">Cancel</button>
            <button class="btn btn-primary" id="categoryModalSave">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              Save Category
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
