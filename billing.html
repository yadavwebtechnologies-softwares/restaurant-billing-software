
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202124">
  <meta name="description" content="Create restaurant bills and print invoices.">

  <title>New Bill | Restaurant Billing</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/buttons.css">

  <script src="js/billing.js" defer></script>
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="app-brand" href="billing.html">Billing</a>

      <nav class="app-nav" aria-label="Main navigation">
        <a href="billing.html" aria-current="page">New Bill</a>
        <a href="invoice-history.html">Bills</a>
        <a href="products.html">Menu Items</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main class="app-container bill-page">
    <section class="bill-heading">
      <h1>New Bill</h1>
      <p>Select items, check the total and print the invoice.</p>
    </section>

    <div class="bill-layout">
      <section class="bill-panel" aria-labelledby="add-item-heading">
        <h2 id="add-item-heading">Add Item</h2>

        <div class="bill-field">
          <label for="productSelect">Food item</label>
          <select id="productSelect" name="product">
            <option value="">Select an item</option>
            <option value="Veg Thali" data-price="120">Veg Thali — ₹120</option>
            <option value="Masala Dosa" data-price="90">Masala Dosa — ₹90</option>
            <option value="Fried Rice" data-price="150">Fried Rice — ₹150</option>
            <option value="Tea" data-price="20">Tea — ₹20</option>
            <option value="Others">Other item</option>
          </select>
        </div>

        <div id="customItemFields" hidden>
          <div class="bill-field">
            <label for="customItemName">Item name</label>
            <input
              id="customItemName"
              type="text"
              maxlength="100"
              placeholder="Enter item name"
            >
          </div>

          <div class="bill-field">
            <label for="customItemPrice">Price (₹)</label>
            <input
              id="customItemPrice"
              type="number"
              min="0.01"
              max="1000000"
              step="0.01"
              placeholder="Enter price"
            >
          </div>
        </div>

        <div class="bill-field">
          <label for="itemQuantity">Quantity</label>
          <input
            id="itemQuantity"
            type="number"
            min="1"
            max="999"
            step="1"
            value="1"
          >
        </div>

        <button class="btn btn-primary bill-add-button" id="addItemButton" type="button">
          Add Item
        </button>
      </section>

      <section class="bill-panel" aria-labelledby="current-bill-heading">
        <h2 id="current-bill-heading">Current Bill</h2>

        <div class="bill-field">
          <label for="customerName">Customer name (optional)</label>
          <input
            id="customerName"
            type="text"
            maxlength="100"
            placeholder="Walk-in customer"
          >
        </div>

        <div id="billItems" aria-live="polite">
          <p class="bill-empty">No items added yet.</p>
        </div>

        <div class="bill-total-row">
          <span>Total Amount</span>
          <strong id="billTotal">₹0.00</strong>
        </div>

        <div class="bill-actions">
          <button class="btn btn-success" id="printBillButton" type="button">
            Generate & Print Invoice
          </button>

          <button class="btn btn-secondary" id="clearBillButton" type="button">
            Clear Bill
          </button>
        </div>

        <p class="bill-note">
          Demo mode: bills are not saved permanently yet.
        </p>
      </section>
    </div>

    <section id="printInvoice" class="bill-print-area" aria-label="Printable invoice"></section>
  </main>
</body>
</html>
